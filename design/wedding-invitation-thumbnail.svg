      <ellipse cx="0" cy="-13" rx="8.5" ry="13" transform="rotate(144)"/>
      <ellipse cx="0" cy="-13" rx="8.5" ry="13" transform="rotate(216)"/>
      <ellipse cx="0" cy="-13" rx="8.5" ry="13" transform="rotate(288)"/>
