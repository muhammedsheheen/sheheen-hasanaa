        <use href="#leaf" transform="translate(10 120) rotate(100)"/>
        <use href="#leaf" transform="translate(70 168) rotate(115) scale(0.8)"/>
        <use href="#leaf" transform="translate(178 52) rotate(20) scale(0.75)"/>
      </g>
      <use href="#rose" transform="translate(56 56)"/>
      <g transform="translate(140 50)"><use href="#petal5" fill="#efe3d0"/><circle r="5" fill="url(#goldV)"/></g>
      <g transform="translate(62 130) scale(0.85)"><use href="#petal5" fill="#f1d9cf"/><circle r="5" fill="url(#goldV)"/></g>
      <g transform="translate(180 100) scale(0.55)"><use href="#petal5" fill="#ecd9ad"/><circle r="5" fill="#fffaf0"/></g>
