  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="1200" height="630" fill="url(#warm)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <rect x="26" y="26" width="1148" height="578" rx="18" fill="none" stroke="#c9a565" stroke-width="1.6"/>
  <rect x="37" y="37" width="1126" height="556" rx="12" fill="none" stroke="#d8bf8f" stroke-width="0.8"/>

  <use href="#cluster" transform="translate(30 30)"/>
  <use href="#cluster" transform="translate(1170 600) rotate(180)"/>

  <text x="600" y="132" text-anchor="middle" font-family="Amiri" font-size="36" fill="url(#gold)" direction="rtl">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</text>

  <text x="600" y="180" text-anchor="middle" font-family="Cormorant Garamond" font-weight="500" font-size="22" letter-spacing="6" fill="#8b7350">WEDDING INVITATION</text>
  <g transform="translate(600 196)" stroke="#c9a565" stroke-width="1">
    <line x1="-110" y1="0" x2="-12" y2="0"/><line x1="12" y1="0" x2="110" y2="0"/>
    <path d="M0 -4.5 L4.5 0 L0 4.5 L-4.5 0 Z" fill="#c9a565" stroke="none"/>
  </g>

  <text x="600" y="282" text-anchor="middle" font-family="Pinyon Script" font-size="78" fill="url(#gold)">Muhammed Sheheen</text>
  <text x="600" y="372" text-anchor="middle" font-family="Pinyon Script" font-size="78" fill="url(#gold)"><tspan font-size="60">&amp; </tspan>Hazana Asharaf</text>

  <text x="600" y="446" text-anchor="middle" font-family="Cormorant Garamond" font-weight="500" font-size="33" fill="#4a3b2a">Sunday, <tspan font-family="Cormorant Infant">29</tspan> November <tspan font-family="Cormorant Infant">2026</tspan> · <tspan font-family="Cormorant Infant">11:00</tspan> AM</text>
  <text x="600" y="488" text-anchor="middle" font-family="Cormorant Garamond" font-style="italic" font-weight="500" font-size="25" letter-spacing="0.5" fill="#7d6a52">Chaithanya Convention Centre, Cherpulassery</text>
