<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfaf4"/>
      <stop offset="0.5" stop-color="#f8f2e7"/>
      <stop offset="1" stop-color="#f3ead9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.47" r="0.55">
      <stop offset="0" stop-color="#fffdf8" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#fffaf0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fffaf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.5" cy="1" r="0.6">
      <stop offset="0" stop-color="#f1dfb8" stop-opacity="0.55"/>
